          </button>
        </div>

      <div id="rank-content">
        <div class="sub-tabs">
          <button class="sub-tab-btn active" data-type="goals">
            Bàn thắng

        <div id="quarterly-ctrl" style="display: none">

            <button class="quarter-btn" data-quarter="2">Q2 (T4-T6)</button>
            <button class="quarter-btn" data-quarter="3">Q3 (T7-T9)</button>
            <button class="quarter-btn" data-quarter="4">Q4 (T10-T12)</button>

      function getLocalOverrides() {
        try {
          const stored = localStorage.getItem("phn_player_scores_override");
          return stored ? JSON.parse(stored) : {};
        } catch (e) {
          return {};
        }
      }

      function saveLocalOverride(playerName, goals, assists) {
        try {
          const overrides = getLocalOverrides();
          overrides[playerName.trim().toLowerCase()] = {
            monthlyGoals: [...goals],
            monthlyAssists: [...assists]
          };
          localStorage.setItem("phn_player_scores_override", JSON.stringify(overrides));
        } catch (e) {}
      }

      async function initRanking() {
        let parsedPlayers = [];
        let psList = [];
        const localOverrides = getLocalOverrides();

        try {
          const { data: pList, error: pErr } = await _supabase
            .from("players")
            .select("*")
            .order("num", { ascending: true });

          if (!pErr && pList && pList.length > 0) {
            parsedPlayers = pList.map((p) => {
              let name = p.name;
              let position = "Hậu vệ";
              if (p.name && p.name.startsWith("{") && p.name.endsWith("}")) {
                try {
                  const meta = JSON.parse(p.name);
                  name = meta.name || "";
                  position = meta.position || "Hậu vệ";
                } catch (e) {}
              }
              return { id: p.id, name, position };
            });
          }
        } catch (e) {}

        // Fallback to DEFAULT_SCORES names if players table is empty or blocked
        if (parsedPlayers.length === 0) {
          parsedPlayers = DEFAULT_SCORES.map((s, idx) => ({
            id: `p-${idx+1}`,
            name: s.name,
            position: 'Cầu thủ'
          }));
        }

        try {
          const { data: psData, error: psErr } = await _supabase
            .from("player_scores")
            .select("*");

          if (!psErr && psData && psData.length > 0) {
            psList = psData;
          }
        } catch (e) {}

        function matchScoreRow(player, row) {
          if (!row) return false;
          if (row.player_id && row.player_id === player.id) return true;
          if (!row.name || !player.name) return false;
          return (
            row.name.trim().toLowerCase() === player.name.trim().toLowerCase()
          );
        }

        rankingData = parsedPlayers.map((p) => {
          let scoreRow = psList.find((row) => matchScoreRow(p, row));
          
          // Fallback to DEFAULT_SCORES if no score row from Supabase
          if (!scoreRow) {
            const def = DEFAULT_SCORES.find(ds => ds.name.trim().toLowerCase() === p.name.trim().toLowerCase());
            if (def) {
              scoreRow = def;
            }
          }

          let mGoals = scoreRow
            ? [
                scoreRow.m1 || 0,
                scoreRow.m2 || 0,
                scoreRow.m3 || 0,
                scoreRow.m4 || 0,
                scoreRow.m5 || 0,
                scoreRow.m6 || 0,
                scoreRow.m7 || 0,
                scoreRow.m8 || 0,
                scoreRow.m9 || 0,
                scoreRow.m10 || 0,
                scoreRow.m11 || 0,
                scoreRow.m12 || 0,
              ]
            : Array(12).fill(0);

          let mAssists = scoreRow
            ? [
                scoreRow.a1 || 0,
                scoreRow.a2 || 0,
                scoreRow.a3 || 0,
                scoreRow.a4 || 0,
                scoreRow.a5 || 0,
                scoreRow.a6 || 0,
                scoreRow.a7 || 0,
                scoreRow.a8 || 0,
                scoreRow.a9 || 0,
                scoreRow.a10 || 0,
                scoreRow.a11 || 0,
                scoreRow.a12 || 0,
              ]
            : Array(12).fill(0);

          // Apply local storage overrides only if Supabase data is empty
          if (psList.length === 0) {
            const playerKey = p.name ? p.name.trim().toLowerCase() : "";
            if (playerKey && localOverrides[playerKey]) {
              if (Array.isArray(localOverrides[playerKey].monthlyGoals)) {
                mGoals = [...localOverrides[playerKey].monthlyGoals];
              }
              if (Array.isArray(localOverrides[playerKey].monthlyAssists)) {
                mAssists = [...localOverrides[playerKey].monthlyAssists];
              }
            }
          }

          return {
            id: p.id,
            scoreId: scoreRow ? scoreRow.id || null : null,
            name: p.name,
            monthlyGoals: mGoals,
            monthlyAssists: mAssists,
            totalGoals: 0,
            totalAssists: 0,
          };
        });

        updateTotals();
        await fetchTeamRankings();
        renderRanking();
      }

      async function fetchTeamRankings() {
        let query = _supabase.from("match_results").select("*");
        if (currentView === "detail") {
          query = query.eq("month", currentMonth);
        } else if (currentView === "quarter") {
          const qMonths = [(currentQuarter - 1) * 3 + 1, (currentQuarter - 1) * 3 + 2, (currentQuarter - 1) * 3 + 3];
          query = query.in("month", qMonths);
        }

        const { data, error } = await query;
        if (error || !data) return;

        const stats = {};

        // Only count internal matches (ignore friendly matches) & deduplicate exact records
        const seenMatches = new Set();
        const internalMatches = data.filter((m) => {
          if (m.status === "friendly") return false;

          const key = `${m.month}_${m.match_date}_${(m.team_a||'').trim().toUpperCase()}_${(m.team_b||'').trim().toUpperCase()}_${m.score_a}_${m.score_b}`;
          if (seenMatches.has(key)) {
            return false; // Skip duplicate record
          }
          seenMatches.add(key);
          return true;
        });

        internalMatches.forEach((m) => {
          const teamAName = m.team_a || "PHN FC";
          const teamBName = m.team_b || "Đối thủ";

          const teams = [teamAName, teamBName];
          teams.forEach((t) => {
            if (!stats[t]) {
              stats[t] = {
                name: t,
                p: 0,
                w: 0,
                d: 0,
                l: 0,
                gf: 0,
                ga: 0,
                gd: 0,
                pts: 0,
              };
            }
          });

          const sA = parseInt(m.score_a) || 0;
          const sB = parseInt(m.score_b) || 0;

          stats[teamAName].p += 1;
          stats[teamBName].p += 1;
          stats[teamAName].gf += sA;
          stats[teamAName].ga += sB;
          stats[teamBName].gf += sB;
          stats[teamBName].ga += sA;

          if (sA > sB) {
            stats[teamAName].w += 1;
            stats[teamAName].pts += 3;
            stats[teamBName].l += 1;
          } else if (sA < sB) {
            stats[teamBName].w += 1;
            stats[teamBName].pts += 3;
            stats[teamAName].l += 1;
          } else {
            stats[teamAName].d += 1;
            stats[teamAName].pts += 1;
            stats[teamBName].d += 1;
            stats[teamBName].pts += 1;
          }
        });

        teamData = Object.values(stats).map((s) => ({
          ...s,
          gd: s.gf - s.ga,
        }));
      }

      function updateTotals() {
        rankingData.forEach((p) => {
          p.totalGoals = p.monthlyGoals.reduce((a, b) => a + b, 0);
          p.totalAssists = p.monthlyAssists.reduce((a, b) => a + b, 0);
        });
      }

      function getScoreForPlayer(p) {
        if (currentView === "summary") {
          return currentType === "goals" ? p.totalGoals : p.totalAssists;
        } else if (currentView === "quarter") {
          const startIdx = (currentQuarter - 1) * 3;
          const arr = currentType === "goals" ? p.monthlyGoals : p.monthlyAssists;
          return arr.slice(startIdx, startIdx + 3).reduce((a, b) => a + b, 0);
        } else {
          const idx = currentMonth - 1;
          return currentType === "goals" ? p.monthlyGoals[idx] : p.monthlyAssists[idx];
        }
      }

      function renderRanking() {
        const body = document.getElementById("rank-body");
        const headRow = document.getElementById("table-head-row");

        let sorted = [...rankingData];

        // Build Table Head Row
        if (currentType === "teams") {
          headRow.innerHTML = `
                    <th style="width: 50px">#</th>
                    <th>Đội bóng</th>
                    <th style="text-align:right;">Trận</th>
                    <th style="text-align:right;">T</th>
                    <th style="text-align:right;">H</th>
                    <th style="text-align:right;">B</th>
                    <th style="text-align:right;">BT</th>
                    <th style="text-align:right;">BB</th>
                    <th style="text-align:right;">HS</th>
                    <th style="text-align:right;">Điểm</th>
                `;
        } else {
          const headText =
            currentView === "summary"
              ? currentType === "goals"
                ? "Tổng bàn thắng"
                : "Tổng kiến tạo"
              : currentView === "quarter"
                ? currentType === "goals"
                  ? `Số bàn Q${currentQuarter} (T${(currentQuarter - 1) * 3 + 1}-T${currentQuarter * 3})`
                  : `Kiến tạo Q${currentQuarter} (T${(currentQuarter - 1) * 3 + 1}-T${currentQuarter * 3})`
                : currentType === "goals"
                  ? `Số bàn T${currentMonth}`
                  : `Kiến tạo T${currentMonth}`;
          headRow.innerHTML = `
                    <th style="width: 50px">#</th>
                    <th>Cầu thủ</th>
                    <th style="text-align:right;">${headText}</th>
                    ${isAdmin && currentView === "detail" ? '<th style="text-align:center; width:150px;">Thao tác</th>' : ""}
                `;
        }

        // Sorting Calculations
        if (currentType === "teams") {
          sorted = [...teamData].sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            if (b.gd !== a.gd) return b.gd - a.gd;
            return b.gf - a.gf;
          });
        } else {
          sorted.sort((a, b) => getScoreForPlayer(b) - getScoreForPlayer(a));
        }

        body.innerHTML = sorted
          .map((p, i) => {
            let nameVal = p.name;
            let statHTML = "";

            if (currentType === "teams") {
              statHTML = `
                        <td style="text-align:right;">${p.p}</td>
                        <td style="text-align:right;">${p.w}</td>
                        <td style="text-align:right;">${p.d}</td>
                        <td style="text-align:right;">${p.l}</td>
                        <td style="text-align:right;">${p.gf}</td>
                        <td style="text-align:right;">${p.ga}</td>
                        <td style="text-align:right;">${p.gd > 0 ? "+" + p.gd : p.gd}</td>
                        <td class="total-col" style="text-align:right;">${p.pts}</td>
                    `;
            } else {
              const score = getScoreForPlayer(p);
              statHTML = `<td class="total-col" style="text-align:right;">${score}</td>`;
            }

            // Render actions in admin mode when viewing details
            const actionHTML =
              isAdmin && currentView === "detail" && currentType !== "teams"
                ? `
                    <td style="text-align:center;">
                        <div style="display:flex; justify-content:center; gap:6px;">
                            <button type="button" class="edit-btn-card" onclick="openEditScoreModal('${p.id}')" style="padding:5px 10px;">
                                <i data-lucide="edit-3" style="width:12px; height:12px; margin-right:2px;"></i> Sửa
                            </button>
                            <button type="button" class="del-btn" onclick="deleteItem('players', '${p.id}')" style="padding:5px 10px;">
                                <i data-lucide="trash-2" style="width:12px; height:12px; margin-right:2px;"></i> Xóa
                            </button>
                        </div>
                    </td>`
                : "";

            return `
                <tr>
                    <td><div class="rank-num">${i + 1}</div></td>
                    <td>${nameVal}</td>
                    ${statHTML}
                    ${actionHTML}
                </tr>`;
          })
          .join("");

        const resetBtn = document.getElementById("reset-month-btn");
        if (resetBtn)
          resetBtn.style.display =
            isAdmin && currentView === "detail" ? "flex" : "none";
        lucide.createIcons();
      }

      async function syncAllToSupabase() {
        if (!isAdmin) {
          alert("Bạn không có quyền thực hiện hành động này!");
          return;
        }
        if (typeof _supabase === 'undefined' || !_supabase) {
          alert("Không tìm thấy kết nối Supabase!");
          return;
        }

        if (!confirm("Bạn có chắc chắn muốn đẩy toàn bộ số liệu của tất cả cầu thủ hiện có lên cơ sở dữ liệu Supabase không?")) {
          return;
        }

        let successCount = 0;
        let failCount = 0;
        let lastError = null;

        for (const p of rankingData) {
          const updates = {};
          for (let m = 1; m <= 12; m++) {
            updates['m' + m] = p.monthlyGoals[m - 1] || 0;
            updates['a' + m] = p.monthlyAssists[m - 1] || 0;
          }

          try {
            let res = await _supabase
              .from("player_scores")
              .update(updates)
              .eq("name", p.name)
              .select();

            if (res.error) {
              failCount++;
              lastError = res.error;
            } else if (!res.data || res.data.length === 0) {
              const insertRes = await _supabase
                .from("player_scores")
                .insert([{
                  name: p.name,
                  player_id: p.id && !String(p.id).startsWith("p-") ? p.id : null,
                  ...updates
                }])
                .select();

              if (insertRes.error) {
                failCount++;
                lastError = insertRes.error;
              } else {
                successCount++;
                if (insertRes.data && insertRes.data.length > 0) {
                  p.scoreId = insertRes.data[0].id;
                }
              }
            } else {
              successCount++;
              p.scoreId = res.data[0].id;
            }
          } catch (e) {
            failCount++;
            lastError = e;
          }
        }

        if (failCount > 0) {
          alert(`⚠️ Đã đồng bộ ${successCount} cầu thủ, nhưng gặp lỗi ở ${failCount} cầu thủ.\nLỗi: ${lastError ? (lastError.message || JSON.stringify(lastError)) : "Không xác định"}\nVui lòng kiểm tra quyền RLS Policy của bảng 'player_scores' trong Supabase Dashboard.`);
        } else {
          alert(`🎉 Đã đồng bộ thành công toàn bộ số liệu của ${successCount} cầu thủ lên máy chủ Supabase!\nBây giờ tất cả mọi người có đường link đều sẽ xem được số liệu mới.`);
        }
        initRanking();
      }

      function openAddPlayerModal() {
        if (!isAdmin) {
          alert("Bạn không có quyền thực hiện hành động này!");
          return;
        }
        const modalTitle = document.getElementById("modal-title");
        if (modalTitle) {
          modalTitle.innerText = "Thêm Cầu thủ vào BXH";
        }
        document.getElementById("r-name").value = "";
        openModal("rank-add");
      }

      async function addPlayerToRanking() {
        if (!isAdmin) {
          alert("Bạn không có quyền thực hiện hành động này!");
          return;
        }
        const name = document.getElementById("r-name").value;
        if (!name) return alert("Vui lòng nhập tên!");

        // Insert player into main players table with the correct position
        const position = "Hậu vệ";
        const namePayload = JSON.stringify({
          name,
          position,
          dob: "",
          hometown: "",
          career: "",
        });

        if (typeof _supabase !== "undefined" && _supabase) {
          try {
            const { data, error } = await _supabase
              .from("players")
              .insert([{ name: namePayload, num: 0 }])
              .select();

            if (error) {
              alert(`⚠️ Lỗi thêm cầu thủ lên Supabase:\n${error.message}\nVui lòng kiểm tra quyền RLS (Row Level Security) của bảng 'players' trong Supabase Dashboard.`);
              return;
            }
          } catch (e) {
            alert("⚠️ Lỗi kết nối Supabase: " + (e.message || e));
            return;
          }
        }
        
        closeModal();
        initRanking();
      }

      async function resetMonth() {
        if (!isAdmin) {
          alert("Bạn không có quyền thực hiện hành động này!");
          return;
        }
        const msg = `Xác nhận RESET toàn bộ bàn thắng & kiến tạo THÁNG ${currentMonth}?`;
        if (confirm(msg)) {
          const updates = { ["m" + currentMonth]: 0, ["a" + currentMonth]: 0 };
          if (typeof _supabase !== "undefined" && _supabase) {
            try {
              const { error } = await _supabase
                .from("player_scores")
                .update(updates)
                .neq("id", "00000000-0000-0000-0000-000000000000");

              if (error) {
                alert(`⚠️ Không thể reset dữ liệu trên Supabase!\nLỗi: ${error.message}\nKiểm tra lại RLS Policy của bảng 'player_scores'.`);
                return;
              }
            } catch (err) {
              alert("⚠️ Lỗi kết nối Supabase: " + (err.message || err));
              return;
            }
          }

          const idx = currentMonth - 1;
          rankingData.forEach((p) => {
            p.monthlyGoals[idx] = 0;
            p.monthlyAssists[idx] = 0;
          });
          
          updateTotals();
          renderRanking();
          alert("Đã reset số liệu Tháng " + currentMonth + " trên hệ thống!");
        }
      }

      function openEditScoreModal(id) {
        if (!isAdmin) {
          alert("Bạn không có quyền thực hiện hành động này!");
          return;
        }
        activeEditingPlayerId = String(id);
        const item = rankingData.find((p) => String(p.id) === String(id));

        if (!item) {
          alert("Không tìm thấy cầu thủ để sửa.");
          return;
        }

        document.getElementById("edit-score-name").value = item.name;
        const idx = currentMonth - 1;

        document.getElementById("edit-score-title").innerText =
          `Sửa số liệu Cầu thủ - T${currentMonth}`;
        document.getElementById("edit-score-label1").innerText = "Bàn thắng";
        document.getElementById("edit-score-label2").innerText = "Kiến tạo";
        document.getElementById("edit-score-input1").value =
          item.monthlyGoals[idx];
        document.getElementById("edit-score-input2").value =
          item.monthlyAssists[idx];

        openModal("edit-score");
      }

      async function saveSingleScore() {
        const item = rankingData.find(
          (p) => String(p.id) === String(activeEditingPlayerId),
        );

        if (!item) {
          alert("Không tìm thấy cầu thủ để lưu.");
          return;
        }

        const val1 =
          parseInt(document.getElementById("edit-score-input1").value) || 0;
        const val2 =
          parseInt(document.getElementById("edit-score-input2").value) || 0;

        const updates = {
          ["m" + currentMonth]: val1,
          ["a" + currentMonth]: val2,
        };

        let supabaseSuccess = false;

        if (typeof _supabase !== "undefined" && _supabase) {
          try {
            let error = null;
            let resData = null;

            if (item.scoreId) {
              const res = await _supabase
                .from("player_scores")
                .update(updates)
                .eq("id", item.scoreId)
                .select();
              error = res.error;
              resData = res.data;
            } else {
              let res = await _supabase
                .from("player_scores")
                .update(updates)
                .eq("name", item.name)
                .select();
              error = res.error;
              resData = res.data;

              if (!error && (!resData || resData.length === 0)) {
                const insertPayload = {
                  name: item.name,
                  player_id: item.id && !String(item.id).startsWith("p-") ? item.id : null,
                  ...updates,
                };
                const insertRes = await _supabase
                  .from("player_scores")
                  .insert([insertPayload])
                  .select();
                error = insertRes.error;
                if (insertRes.data && insertRes.data.length > 0) {
                  item.scoreId = insertRes.data[0].id;
                }
              }
            }

            if (error) {
              console.error("Supabase sync error:", error);
              alert(`⚠️ CẢNH BÁO LƯU DỮ LIỆU THẤT BẠI!\n\nKhông thể lưu lên Supabase: ${error.message || JSON.stringify(error)}\n\nHãy vào Supabase Dashboard -> Table Editor -> 'player_scores' để kiểm tra xem đã cho phép người dùng nặc danh (anon) INSERT/UPDATE chưa (RLS Policy).`);
            } else {
              supabaseSuccess = true;
            }
          } catch (err) {
            console.error("Supabase sync exception:", err);
            alert("⚠️ Lỗi kết nối Supabase: " + (err.message || err));
          }
        } else {
          alert("⚠️ Không tìm thấy đối tượng kết nối Supabase!");
        }

        if (supabaseSuccess) {
          // Update in-memory state and render
          item.monthlyGoals[currentMonth - 1] = val1;
          item.monthlyAssists[currentMonth - 1] = val2;
          saveLocalOverride(item.name, item.monthlyGoals, item.monthlyAssists);

          updateTotals();
          renderRanking();
          closeModal();
        }
      }

      document.querySelectorAll(".rank-tab-btn").forEach((btn) =>
        btn.addEventListener("click", async () => {
          document
            .querySelectorAll(".rank-tab-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentView = btn.dataset.target;
          document.getElementById("monthly-ctrl").style.display =
            currentView === "detail" ? "block" : "none";
          document.getElementById("quarterly-ctrl").style.display =
            currentView === "quarter" ? "block" : "none";
          if (currentType === "teams") await fetchTeamRankings();
          renderRanking();
        }),
      );

      document.querySelectorAll(".quarter-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          document
            .querySelectorAll(".quarter-btn")
            .forEach((q) => q.classList.remove("active"));
          btn.classList.add("active");
          currentQuarter = parseInt(btn.dataset.quarter);
          if (currentType === "teams") await fetchTeamRankings();
          renderRanking();
        });
      });

      document.querySelectorAll(".sub-tab-btn").forEach((btn) =>
        btn.addEventListener("click", async () => {
          document
            .querySelectorAll(".sub-tab-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentType = btn.dataset.type;

          if (currentType === "teams" && currentView === "summary") {
            currentView = "detail";
            document.querySelectorAll(".rank-tab-btn").forEach((b) => {
              b.classList.toggle("active", b.dataset.target === "detail");
            });
            document.getElementById("monthly-ctrl").style.display = "block";
            document.getElementById("quarterly-ctrl").style.display = "none";
          }

          if (currentType === "teams") await fetchTeamRankings();
          renderRanking();
        }),
      );

      const monthSel = document.querySelector(".month-selector");
      const t1Btn = document.querySelector('.month-btn[data-month="1"]');
      if (t1Btn) {
        t1Btn.onclick = async () => {
          document
            .querySelectorAll(".month-btn")
            .forEach((m) => m.classList.remove("active"));
          t1Btn.classList.add("active");
          currentMonth = 1;
          if (currentType === "teams") await fetchTeamRankings();
          renderRanking();
        };
      }
      for (let i = 2; i <= 12; i++) {
        const b = document.createElement("button");
        b.className = "month-btn";
        b.dataset.month = i;
        b.innerText = "T" + i;
        b.onclick = async () => {
          document
            .querySelectorAll(".month-btn")
            .forEach((m) => m.classList.remove("active"));
          b.classList.add("active");
          currentMonth = i;
          if (currentType === "teams") await fetchTeamRankings();
          renderRanking();
        };
        monthSel.appendChild(b);
      }

      function renderAll() {
        initRanking();
      }
      window.onload = initRanking;
    </script>
  </body>
</html>
