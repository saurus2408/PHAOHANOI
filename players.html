<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách cầu thủ | PHN FC</title>
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <!-- Tier 1: Deep Crimson utility bar -->
        <div class="header-top">
            <div class="header-top-container">
                <div class="header-top-left">
                    <span>PHÁO HÀ NỘI FOOTBALL CLUB - TRANG WEB CHÍNH THỨC</span>
                </div>
                <div class="header-top-right">
                    <a href="https://www.facebook.com/profile.php?id=61586374958119" class="header-top-link" target="_blank">Facebook</a>
                    <a href="https://www.youtube.com/@PHNFCafchn" class="header-top-link" target="_blank">Youtube</a>
                    <a href="https://www.tiktok.com/@phnfc07" class="header-top-link" target="_blank">TikTok</a>
                    <div class="header-admin-link" id="header-admin-btn" onclick="toggleAdmin()">
                        <img src="assets/images/icondn.jpg" alt="Login" style="pointer-events: none;">
                    </div>
                </div>
            </div>
        </div>
        <!-- Tier 2: Bright Red navigation bar -->
        <div class="header-bottom">
            <div class="header-bottom-container">
                <a href="index.html" class="logo-wrapper">
                    <img src="assets/images/Logph.png" alt="CLB Logo" class="logo-img">
                    <span class="site-name">PHN</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="players.html" class="nav-link active">Cầu thủ</a></li>
                    <li><a href="videos.html" class="nav-link">Video</a></li>
                    <li><a href="results.html" class="nav-link">Kết quả</a></li>
                    <li><a href="rankings.html" class="nav-link">Xếp hạng</a></li>
                    <li><a href="awards.html" class="nav-link">Giải thưởng</a></li>
                </ul>
                <div class="mobile-toggle" id="mobile-toggle">
                    <i data-lucide="menu"></i>
                </div>
            </div>
        </div>
    </header>

    <section id="players">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h2 class="section-title" style="margin-bottom: 0;">Danh sách cầu thủ</h2>
            <button class="btn-primary admin-only" onclick="openAddPlayerModal()"><i data-lucide="plus"></i> Thêm cầu thủ</button>
        </div>

        <!-- Controls / Search -->
        <div class="player-list-controls">
            <div class="player-search-box">
                <i data-lucide="search"></i>
                <input type="text" id="player-search-input" placeholder="Tìm kiếm cầu thủ theo tên, quê quán..." oninput="filterPlayers()">
            </div>
        </div>

        <!-- High-Density Data Table (List View) -->
        <div class="player-table-wrapper">
            <table class="player-table">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">#</th>
                        <th>Cầu thủ</th>
                        <th>Ngày sinh</th>
                        <th>Quê quán</th>
                        <th>Nghề nghiệp</th>
                        <th id="admin-col-header" style="text-align: center; width: 140px; display: none;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="players-list-body">
                    <!-- Dynamic List Rows -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Modals -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    
    <!-- Player Creation/Edition Modal -->
    <div class="modal-admin" id="player-modal">
        <h2 id="player-modal-title">Thêm Cầu thủ</h2>
        <div class="form-group">
            <label>Số áo</label>
            <input type="number" id="p-num">
        </div>
        <div class="form-group">
            <label>Tên cầu thủ</label>
            <input type="text" id="p-name" placeholder="Vd: Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label>Vị trí</label>
            <select id="p-position">
                <option value="Thủ môn">Thủ môn</option>
                <option value="Hậu vệ">Hậu vệ</option>
                <option value="Tiền vệ">Tiền vệ</option>
                <option value="Tiền đạo">Tiền đạo</option>
            </select>
        </div>
        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="date" id="p-dob">
        </div>
        <div class="form-group">
            <label>Quê quán</label>
            <input type="text" id="p-hometown" placeholder="Vd: Hà Nội">
        </div>
        <div class="form-group">
            <label>Nghề nghiệp</label>
            <input type="text" id="p-career" placeholder="Vd: Kỹ sư, Học sinh...">
        </div>
        <button class="btn-primary" onclick="savePlayer()" style="width: 100%;">Lưu</button>
    </div>

    <!-- Player Detail Modal -->
    <div class="modal-admin" id="player-detail-modal">
        <div id="player-detail-content">
            <!-- Dynamic Detail Content -->
        </div>
        <button class="btn-primary" onclick="closeModal()" style="width: 100%; margin-top: 20px;">Đóng</button>
    </div>

        let editingPlayerId = null;
        let currentEditingImg = '';
        let allPlayersList = DEFAULT_PLAYERS.map(p => ({
            id: p.num,
            num: p.num,
            rawName: p.name,
            name: p.name,
            position: p.position,
            dob: p.dob,
            hometown: p.hometown,
            career: p.career,
            img: ''
        }));

        async function fetchPlayers() {
            let fetchedList = [];
            try {
                if (typeof _supabase !== 'undefined' && _supabase) {
                    const { data: pList, error: pErr } = await _supabase.from('players').select('*').order('num', { ascending: true });
                    if (!pErr && pList && pList.length > 0) {
                        fetchedList = pList;
                    }
                }
            } catch (e) {
                console.warn("Supabase fetch error, using default list:", e);
            }

            if (fetchedList.length > 0) {
                allPlayersList = fetchedList.map(p => {
                    let rawName = p.name || '';
                    let name = rawName;
                    let position = 'Hậu vệ';
                    let dob = 'Chưa cập nhật';
                    let hometown = 'Chưa cập nhật';
                    let career = 'Chưa cập nhật';

                    if (rawName && rawName.startsWith('{') && rawName.endsWith('}')) {
                        try {
                            const meta = JSON.parse(rawName);
                            name = meta.name || '';
                            position = meta.position || 'Hậu vệ';
                            dob = meta.dob || 'Chưa cập nhật';
                            hometown = meta.hometown || 'Chưa cập nhật';
                            career = meta.career || 'Chưa cập nhật';
                        } catch(e) {}
                    }

                    return {
                        id: p.id,
                        num: p.num || 0,
                        rawName: rawName,
                        name: name || 'Cầu thủ',
                        position: position,
                        dob: dob,
                        hometown: hometown,
                        career: career,
                        img: p.img || ''
                    };
                });
                renderPlayerList(allPlayersList);
            }
        }

        function handlePlayerRowClick(idx, event) {
            if (event && event.target && (event.target.closest('button') || event.target.closest('.del-btn') || event.target.closest('.edit-btn-card'))) {
                return;
            }
            const p = allPlayersList[idx];
            if (p) {
                showPlayerDetails(p);
            }
        }

        function handleEditPlayerClick(idx) {
            const p = allPlayersList[idx];
            if (p) {
                openEditPlayerModal(p);
            }
        }

        function renderPlayerList(playersToRender) {
            const body = document.getElementById('players-list-body');
            const adminHeader = document.getElementById('admin-col-header');
            if (adminHeader) {
                adminHeader.style.display = isAdmin ? 'table-cell' : 'none';
            }

            if (!body) return;

            if (!playersToRender || playersToRender.length === 0) {
                body.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" style="text-align:center; padding:30px; color:var(--text-muted);">Chưa có dữ liệu cầu thủ. Vui lòng chạy script SQL trên Supabase hoặc nhấn "Thêm cầu thủ".</td></tr>`;
                return;
            }

            body.innerHTML = playersToRender.map((p, idx) => {
                let dobFormatted = p.dob;
                if (p.dob && p.dob !== 'Chưa cập nhật') {
                    const parts = p.dob.split('-');
                    if (parts.length === 3) {
                        dobFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    }
                }

                const hometownDisplay = p.hometown !== 'Chưa cập nhật' ? `${p.hometown} 🇻🇳` : p.hometown;

                return `
                <tr class="player-row" onclick="handlePlayerRowClick(${idx}, event)">
                    <td style="text-align: center;"><span class="player-num-pill">${p.num || '?'}</span></td>
                    <td>
                        <div class="player-name-cell">
                            <span class="player-name-title">${p.name}</span>
                            <span class="player-position-pill">${p.position}</span>
                        </div>
                    </td>
                    <td><i data-lucide="calendar" style="width:12px; height:12px; margin-right:4px; color:var(--text-muted);"></i>${dobFormatted}</td>
                    <td><i data-lucide="map-pin" style="width:12px; height:12px; margin-right:4px; color:var(--primary);"></i>${hometownDisplay}</td>
                    <td><i data-lucide="briefcase" style="width:12px; height:12px; margin-right:4px; color:var(--accent);"></i>${p.career || 'Chưa cập nhật'}</td>
                    ${isAdmin ? `
                    <td style="text-align: center;" onclick="event.stopPropagation();">
                        <div style="display:flex; justify-content:center; gap:6px;">
                            <button type="button" class="edit-btn-card" onclick="handleEditPlayerClick(${idx})" style="padding:4px 8px;">
                                <i data-lucide="edit-3" style="width:12px; height:12px;"></i> Sửa
                            </button>
                            <button type="button" class="del-btn" onclick="deleteItem('players', '${p.id}')" style="padding:4px 8px;">
                                <i data-lucide="trash-2" style="width:12px; height:12px;"></i> Xóa
                            </button>
                        </div>
                    </td>` : ''}
                </tr>
                `;
            }).join('');

            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                try { lucide.createIcons(); } catch(e){}
            }
        }

        function filterPlayers() {
            const query = document.getElementById('player-search-input').value.toLowerCase().trim();
            if (!query) {
                renderPlayerList(allPlayersList);
                return;
            }
            const filtered = allPlayersList.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.hometown.toLowerCase().includes(query) ||
                p.position.toLowerCase().includes(query) ||
                p.career.toLowerCase().includes(query) ||
                String(p.num).includes(query)
            );
            renderPlayerList(filtered);
        }

        function openAddPlayerModal() {
            if (!isAdmin) { alert('Bạn không có quyền thực hiện hành động này!'); return; }
            editingPlayerId = null;
            document.getElementById('player-modal-title').innerText = 'Thêm Cầu thủ';
            document.getElementById('p-num').value = '';
            document.getElementById('p-name').value = '';
            document.getElementById('p-position').value = 'Hậu vệ';
            document.getElementById('p-dob').value = '';
            document.getElementById('p-hometown').value = '';
            document.getElementById('p-career').value = '';
            openModal('player');
        }

        function openEditPlayerModal(p) {
            if (!isAdmin) { alert('Bạn không có quyền thực hiện hành động này!'); return; }
            editingPlayerId = p.id || null;
            document.getElementById('player-modal-title').innerText = 'Chỉnh sửa Cầu thủ';

            document.getElementById('p-num').value = p.num || '';
            document.getElementById('p-name').value = p.name || '';
            document.getElementById('p-position').value = p.position || 'Hậu vệ';
            document.getElementById('p-dob').value = p.dob === 'Chưa cập nhật' ? '' : (p.dob || '');
            document.getElementById('p-hometown').value = p.hometown === 'Chưa cập nhật' ? '' : (p.hometown || '');
            document.getElementById('p-career').value = p.career === 'Chưa cập nhật' ? '' : (p.career || '');
            openModal('player');
        }

                }
            }

                detailContent.innerHTML = `
                    <div class="player-modal-detail">
                        <div class="modal-player-header" style="align-items: center; gap: 15px; margin-bottom: 20px;">
                            <div class="player-num-pill" style="min-width:50px; height:50px; font-size:1.5rem; border-radius:12px;">#${p.num || '?'}</div>
                            <div class="modal-player-title">
                                <h2 style="border:none; margin-bottom: 2px;">${p.name}</h2>
                                <span class="player-position-pill">${p.position}</span>
                            </div>
                        </div>

                        <div class="modal-player-grid" style="grid-template-columns: 1fr; gap: 12px;">
                            <div>
                                <div class="detail-item-label">Ngày sinh</div>
                                <div class="detail-item-value">${dobFormatted}</div>
                            </div>
                            <div>
                                <div class="detail-item-label">Số áo</div>
                                <div class="detail-item-value">#${p.num || '?'}</div>
                            </div>
                            <div>
                                <div class="detail-item-label">Vị trí thi đấu</div>
                                <div class="detail-item-value">${p.position}</div>
                            </div>
                            <div>
                                <div class="detail-item-label">Quê quán</div>
                                <div class="detail-item-value">🇻🇳 ${p.hometown}</div>
                            </div>
                            <div>
                                <div class="detail-item-label">Nghề nghiệp</div>
                                <div class="detail-item-value">${p.career}</div>
                            </div>
                        </div>
                    </div>
                `;
                openModal('player-detail');
            }
        }

        async function savePlayer() {
            const numInput = document.getElementById('p-num');
            const nameInput = document.getElementById('p-name');
            const posInput = document.getElementById('p-position');
            const dobInput = document.getElementById('p-dob');
            const hometownInput = document.getElementById('p-hometown');
            const careerInput = document.getElementById('p-career');

            const num = numInput ? numInput.value : '';
            const name = nameInput ? nameInput.value : '';
            const position = posInput ? posInput.value : 'Hậu vệ';
            const dob = dobInput && dobInput.value ? dobInput.value : 'Chưa cập nhật';
            const hometown = hometownInput && hometownInput.value ? hometownInput.value : 'Chưa cập nhật';
            const career = careerInput && careerInput.value ? careerInput.value : 'Chưa cập nhật';
            
            if (!num || !name) {
                alert("Vui lòng điền số áo và tên cầu thủ!");
                return;
            }

            const playerItem = {
                id: editingPlayerId || `p-${Date.now()}`,
                num: parseInt(num),
                rawName: name,
                name: name,
                position: position,
                dob: dob,
                hometown: hometown,
                career: career,
                img: ''
            };

            if (editingPlayerId) {
                const idx = allPlayersList.findIndex(p => String(p.id) === String(editingPlayerId) || p.num === parseInt(num));
                if (idx !== -1) {
                    allPlayersList[idx] = playerItem;
                } else {
                    allPlayersList.unshift(playerItem);
                }
            } else {
                allPlayersList.unshift(playerItem);
            }

            closeModal();
            renderPlayerList(allPlayersList);

            if (typeof _supabase !== 'undefined' && _supabase) {
                try {
                    const namePayload = JSON.stringify({ name, position, dob, hometown, career });
                    const payload = { num: parseInt(num), name: namePayload, img: '' };
                    if (editingPlayerId && typeof editingPlayerId === 'string' && !editingPlayerId.startsWith('p-')) {
                        await _supabase.from('players').update(payload).eq('id', editingPlayerId);
                    } else {
                        await _supabase.from('players').insert([payload]);
                    }
                } catch(e) {}
            }
        }

        function renderAll() { fetchPlayers(); }
        renderPlayerList(allPlayersList);
        document.addEventListener('DOMContentLoaded', () => {
            renderPlayerList(allPlayersList);
            fetchPlayers();
        });
        window.onload = function() {
            renderPlayerList(allPlayersList);
            fetchPlayers();
        };
    </script>
</body>

</html>
